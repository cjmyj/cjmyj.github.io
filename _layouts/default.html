<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="container">
  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">{ Linux Kernel Notes }</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/blog/' | relative_url }}">文章</a>
      <a href="{{ '/categories/' | relative_url }}">分类</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© {{ site.time | date: '%Y' }} Linux Kernel Notes · Powered by Jekyll & GitHub Pages</footer>
</div>
</body>
</html>
