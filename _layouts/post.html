---
layout: default
---
<article class="article">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← 返回文章列表</a></p>
  <h1>{{ page.title | escape }}</h1>
  <p class="muted">{{ page.date | date: '%Y-%m-%d' }} · {% for cat in page.categories %}<a href="{{ '/categories/' | relative_url }}?name={{ cat | url_encode }}">{{ cat | escape }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</p>
  <div class="post-content">{{ content }}</div>
</article>
